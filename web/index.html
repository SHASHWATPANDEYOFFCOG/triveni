<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Triveni · the AI Finance Controller</title>
    <meta
      name="description"
      content="Three ledgers, one balanced set of books, with a statistically guaranteed error bound."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/app.css" />
    <link rel="stylesheet" href="./styles/screens.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E0%A4%A4%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Applied before first paint so a dark-theme user never sees a light flash.
      (() => {
        try {
          const saved = localStorage.getItem("triveni-theme");
          if (saved) document.documentElement.dataset.theme = saved;
        } catch {
          /* private mode; the media query still gives the right default */
        }
      })();
    </script>
  </head>
  <body>
    <a class="sr-only" href="#main">Skip to content</a>

    <!-- Four inert layers: ground, aurora, grid, grain. Never interactive, never
         announced. See base.css for why each one is there. -->
    <div class="backdrop" aria-hidden="true">
      <div class="aurora aurora-1"></div>
      <div class="aurora aurora-2"></div>
      <div class="aurora aurora-3"></div>
      <div class="grid-layer"></div>
      <div class="noise-layer"></div>
    </div>

    <div class="app" id="app">
      <aside class="rail" id="rail" aria-label="Screens">
        <a class="brand" href="./landing.html">
          <span class="devanagari" aria-hidden="true">त्रि</span>
          <span>
            <span class="name">Triveni</span>
            <span class="tagline">three ledgers, one set of books</span>
          </span>
        </a>

        <nav class="nav" aria-label="Screens">
          <p class="nav-label">Close</p>
          <button data-screen="confluence" aria-current="page">
            <span class="n" aria-hidden="true">1</span> Confluence
          </button>
          <button data-screen="stages"><span class="n" aria-hidden="true">2</span> Stages</button>
          <button data-screen="alpha"><span class="n" aria-hidden="true">3</span> α slider</button>
          <button data-screen="triage"><span class="n" aria-hidden="true">4</span> Triage</button>

          <p class="nav-label">Explain</p>
          <button data-screen="waterfall"><span class="n" aria-hidden="true">5</span> Settlement</button>

          <p class="nav-label">Foresee</p>
          <button data-screen="forecast"><span class="n" aria-hidden="true">6</span> Forecast</button>

          <p class="nav-label">Evidence</p>
          <button data-screen="audit"><span class="n" aria-hidden="true">7</span> Audit</button>
          <button data-screen="report"><span class="n" aria-hidden="true">8</span> Report</button>
        </nav>

        <div class="rail-foot">
          <span class="model-status" id="rail-status" title="Operating mode">
            <span class="status-dot" data-live="true" aria-hidden="true"></span>
            <span id="rail-mode">connecting…</span>
          </span>
          <p class="faint" style="font-size: var(--text-xs)">
            No credentials. No money movement. Reads and proposes only.
          </p>
        </div>
      </aside>

      <div class="scrim" id="rail-scrim" hidden></div>

      <header class="topbar">
        <div class="topbar-meta">
          <button
            class="btn ghost icon-btn rail-toggle"
            id="rail-toggle"
            aria-label="Open navigation"
            aria-expanded="false"
            aria-controls="rail"
          >
            <span aria-hidden="true">☰</span>
          </button>
          <span class="hide-xs">Books for</span>
          <strong class="num" id="topbar-date">2026-03-31</strong>
        </div>

        <div class="topbar-actions">
          <button class="palette-trigger" id="palette-trigger" aria-label="Open the command palette">
            <span aria-hidden="true">⌕</span>
            <span class="grow">Search or jump to…</span>
            <span class="kbd" aria-hidden="true">Ctrl K</span>
          </button>
          <button
            class="btn icon-btn ghost"
            id="theme-toggle"
            title="Switch theme"
            aria-label="Switch between light and dark theme"
          >
            <span aria-hidden="true" id="theme-icon">◐</span>
          </button>
          <button
            class="btn ghost icon-btn"
            id="help-toggle"
            title="Keyboard shortcuts"
            aria-label="Keyboard shortcuts"
          >
            <span aria-hidden="true">?</span>
          </button>
        </div>
      </header>

      <main class="main" id="main" tabindex="-1">
        <div id="connection" hidden></div>

        <section class="screen" data-screen="confluence" data-active="true" aria-label="The Confluence"></section>
        <section class="screen" data-screen="stages" aria-label="Stage ladder"></section>
        <section class="screen" data-screen="alpha" aria-label="Error bound slider"></section>
        <section class="screen" data-screen="triage" aria-label="Exception triage"></section>
        <section class="screen" data-screen="waterfall" aria-label="Settlement decomposition"></section>
        <section class="screen" data-screen="forecast" aria-label="Cash forecast"></section>
        <section class="screen" data-screen="audit" aria-label="The ledger of record"></section>
        <section class="screen" data-screen="report" aria-label="Run report"></section>
      </main>
    </div>

    <div id="palette" class="palette" hidden role="dialog" aria-modal="true" aria-label="Command palette"></div>
    <div id="help" class="overlay" hidden role="dialog" aria-modal="true" aria-label="Keyboard shortcuts"></div>
    <div class="toast-region" id="toasts" role="region" aria-label="Notifications"></div>
    <div id="live" class="sr-only" aria-live="polite" aria-atomic="false"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
